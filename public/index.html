<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gemini Fragrance Advisor AI Chatbot</title>
  <script>
    // Terapkan tema sedini mungkin supaya tidak ada kedipan warna saat halaman dimuat.
    (function () {
      try {
        var saved = localStorage.getItem('theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = saved || (prefersDark ? 'dark' : 'light');
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    })();
  </script>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div class="container">
    <header class="app-header">
      <div class="brand-mark" aria-hidden="true">🌿</div>
      <div class="brand-text">
        <h1>Gemini Fragrance AI Chatbot</h1>
        <p class="subtitle">Konsultan parfum pribadi Anda</p>
      </div>
      <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Ganti mode gelap/terang" title="Ganti tema">
        <span class="icon-moon" aria-hidden="true">🌙</span>
        <span class="icon-sun" aria-hidden="true">☀️</span>
      </button>
    </header>

    <div id="chat-box" class="chat-box">
      <div class="empty-state" id="empty-state">
        <strong>Halo! 👋</strong><br />
        Ceritakan aroma favorit atau suasana yang Anda inginkan,<br />
        dan saya akan merekomendasikan parfum yang cocok.
      </div>
    </div>

    <form id="chat-form">
      <input type="text" id="user-input" placeholder="Tulis pesan Anda..." autocomplete="off" required />
      <button type="submit">Kirim</button>
    </form>
  </div>
  <script src="markdown.js"></script>
  <script src="script.js"></script>
</body>
</html>
